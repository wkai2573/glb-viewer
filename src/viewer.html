<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<script type="module" src="model-viewer.min.js"></script>
<style>
  :root {
    --bg: #15171b;
    --bar: rgba(255, 255, 255, 0.07);
    --fg: #e8eaee;
    --muted: #9aa0aa;
    --accent: #6ea8ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif; overflow: hidden; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; background: radial-gradient(circle at 50% 40%, #2a2e36, var(--bg) 70%); }
  .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--bar); backdrop-filter: blur(8px); z-index: 2; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12px; }
  button { background: transparent; color: var(--fg); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b1220; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    color: var(--muted); pointer-events: none; z-index: 1; }
  #msg.err { color: #ff8a8a; }
</style>
</head>
<body>
<div class="bar">
  <div class="name">{{NAME}}</div>
  <span class="hint">左鍵旋轉 · 滾輪縮放 · 右鍵平移</span>
  <button id="rotate" aria-pressed="true">自動旋轉</button>
  <button id="anim" hidden aria-pressed="false">播放動畫</button>
</div>
<div id="msg">載入中…</div>
<model-viewer id="mv" src="model.glb" alt="{{NAME}}"
  camera-controls touch-action="pan-y" auto-rotate
  shadow-intensity="1" environment-image="neutral" exposure="1"
  interaction-prompt="none"></model-viewer>
<script>
  const mv = document.getElementById('mv');
  const msg = document.getElementById('msg');
  const rotate = document.getElementById('rotate');
  const anim = document.getElementById('anim');

  mv.addEventListener('load', () => {
    msg.hidden = true;
    if (mv.availableAnimations && mv.availableAnimations.length) {
      anim.hidden = false;
    }
  });
  mv.addEventListener('error', () => {
    msg.hidden = false;
    msg.className = 'err';
    msg.textContent = '無法載入模型。檔案可能已損毀，或使用了需要連網下載解碼器的壓縮格式。';
  });
  setTimeout(() => {
    if (!customElements.get('model-viewer')) {
      msg.className = 'err';
      msg.textContent = '無法載入檢視元件，請重新安裝 glb-viewer。';
    }
  }, 8000);

  rotate.addEventListener('click', () => {
    const on = rotate.getAttribute('aria-pressed') !== 'true';
    rotate.setAttribute('aria-pressed', String(on));
    mv.autoRotate = on;
  });
  anim.addEventListener('click', () => {
    const on = anim.getAttribute('aria-pressed') !== 'true';
    anim.setAttribute('aria-pressed', String(on));
    if (on) { mv.play(); } else { mv.pause(); }
  });

  // 視窗關閉時通知伺服器結束；重新整理則會取消結束。
  window.addEventListener('pagehide', () => navigator.sendBeacon('bye'));
  setInterval(() => fetch('ping').catch(() => {}), 5000);
</script>
</body>
</html>
