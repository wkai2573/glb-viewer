<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
<link rel="icon" href="GlbViewer.ico">
<style>
  :root {
    --bg: #15171b;
    --bar: rgba(255, 255, 255, 0.07);
    --panel: rgba(28, 31, 37, 0.92);
    --line: rgba(255, 255, 255, 0.14);
    --fg: #e8eaee;
    --muted: #9aa0aa;
    --accent: #6ea8ff;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; background: radial-gradient(circle at 50% 40%, #2a2e36, var(--bg) 70%); }
  #stage canvas { display: block; touch-action: none; }
  .bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--bar); backdrop-filter: blur(8px); z-index: 3; }
  .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
  button { background: transparent; color: var(--fg); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 6px; padding: 4px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #0b1220; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px;
    color: var(--muted); pointer-events: none; z-index: 1; }
  #msg.err { color: #ff8a8a; }

  #panel { position: fixed; top: 52px; right: 12px; bottom: 12px; width: 272px; overflow-y: auto; z-index: 2;
    padding: 14px; display: flex; flex-direction: column; gap: 14px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); }
  #panel h2 { font-size: 12px; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; font-weight: 700; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; border-right: 1px solid var(--line); padding: 6px 4px; font-size: 13px; }
  .seg button:last-child { border-right: 0; }
  .seg button.active { background: var(--accent); color: #0b1220; font-weight: 600; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .row { display: grid; grid-template-columns: 88px 1fr 44px; align-items: center; gap: 8px; margin: 4px 0; }
  .row span:last-child { text-align: right; font-family: Consolas, monospace; font-size: 12px; color: var(--muted); }
  .row.dim { opacity: 0.4; }
  .check { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  input[type="range"] { width: 100%; min-width: 0; accent-color: var(--accent); }

  @media (max-width: 760px) { .hint { display: none; } }
  .dlg-overlay { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px;
    background: rgba(0, 0, 0, 0.55); }
  .dlg-overlay .card { width: min(380px, 100%); padding: 20px; background: #1c1f25; color: var(--fg);
    border: 1px solid var(--line); border-radius: 12px; }
  .dlg-overlay h2 { margin: 0 0 8px; font-size: 16px; }
  .dlg-overlay p { margin: 0 0 16px; color: var(--muted); overflow-wrap: anywhere; }
  .dlg-overlay .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .dlg-overlay .actions:empty { display: none; }
  .dlg-overlay .actions button.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; }

  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .card-head h2 { margin: 0; font-size: 16px; }
  .icon-btn { border: 0; padding: 4px 8px; font-size: 14px; color: var(--muted); border-radius: 4px; }
  .icon-btn:hover { color: var(--fg); border-color: transparent; background: rgba(255, 255, 255, 0.08); }
  .settings-sec { margin-bottom: 16px; }
  .settings-sec h3 { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; font-weight: 700; text-transform: uppercase; }
  .ver-row { display: flex; justify-content: space-between; align-items: center; }
  .ver-text { font-family: Consolas, monospace; color: var(--muted); font-size: 13px; }
  .update-result { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.4; }
  .update-result.err { color: #ff8a8a; }
  .update-result .highlight { color: #6ea8ff; margin-bottom: 6px; }
  .update-result .update-action button { background: var(--accent); border-color: var(--accent); color: #0b1220; font-weight: 600; width: 100%; margin-top: 6px; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="bar">
  <div class="name">{{NAME}}</div>
  <span class="hint" data-i18n="hint">Left-drag to rotate · Scroll to zoom · Right-drag to pan</span>
  <button id="rotate" aria-pressed="false" data-i18n="rotate">Auto Rotate</button>
  <button id="anim" hidden aria-pressed="false" data-i18n="anim">Play Animation</button>
  <button id="lightBtn" aria-pressed="false" aria-controls="panel" data-i18n="light">Lighting</button>
  <button id="settingsBtn" type="button" aria-haspopup="dialog" data-i18n="settings">⚙️ Settings</button>
</div>
<aside id="panel" hidden>
  <section>
    <h2 data-i18n="presets_title">LIGHTING PRESETS</h2>
    <div class="grid2" id="presets"></div>
  </section>
  <section>
    <h2 data-i18n="modes_title">DISPLAY MODE</h2>
    <div class="seg" id="modes">
      <button type="button" data-mode="lit" aria-pressed="false" data-i18n="mode_lit">Lit</button>
      <button type="button" data-mode="flat" aria-pressed="false" data-i18n="mode_flat">Flat</button>
      <button type="button" data-mode="toon" aria-pressed="false" data-i18n="mode_toon">Toon</button>
    </div>
    <p class="note" id="modenote"></p>
  </section>
  <section>
    <h2 data-i18n="lighting_title">LIGHTING</h2>
    <label class="check"><input type="checkbox" id="attach"> <span data-i18n="attach">Attach light to camera</span></label>
    <div class="row" id="rowAz"><label for="az" data-i18n="az">Azimuth</label><input type="range" id="az" min="-180" max="180" step="1"><span id="azv"></span></div>
    <div class="row" id="rowEl"><label for="el" data-i18n="el">Elevation</label><input type="range" id="el" min="-89" max="89" step="1"><span id="elv"></span></div>
    <div class="row" id="rowI"><label for="dirI" data-i18n="dirI">Brightness</label><input type="range" id="dirI" min="0" max="3" step="0.05"><span id="dirIv"></span></div>
    <div class="row" id="rowA"><label for="amb" data-i18n="amb">Ambient</label><input type="range" id="amb" min="0" max="1.5" step="0.05"><span id="ambv"></span></div>
    <div class="row" id="rowT"><label for="thr" data-i18n="thr">Shadow Threshold</label><input type="range" id="thr" min="-0.5" max="0.5" step="0.01"><span id="thrv"></span></div>
    <div class="row" id="rowH"><label for="hi" data-i18n="hi">Highlight Threshold</label><input type="range" id="hi" min="0.1" max="0.9" step="0.01"><span id="hiv"></span></div>
    <div class="row" id="rowO"><label for="outline" data-i18n="outline">Outline</label><input type="range" id="outline" min="0" max="5" step="0.1"><span id="outlinev"></span></div>
    <p class="note" data-i18n="drag_hint">Hold Shift and drag on canvas to rotate light source.</p>
  </section>
</aside>
<div id="msg" data-i18n="loading">Loading…</div>

<div id="dlg" class="dlg-overlay" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" hidden>
  <div class="card" tabindex="-1">
    <h2 id="dlgTitle"></h2>
    <p id="dlgBody"></p>
    <div class="actions" id="dlgActions"></div>
  </div>
</div>

<div id="settingsDlg" class="dlg-overlay" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" hidden>
  <div class="card" tabindex="-1">
    <div class="card-head">
      <h2 id="settingsTitle" data-i18n="settings_title">Settings</h2>
      <button id="closeSettingsBtn" class="icon-btn" type="button" aria-label="Close">✕</button>
    </div>
    <section class="settings-sec">
      <h3 data-i18n="lang_title">LANGUAGE</h3>
      <div class="seg" id="langSeg">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="zh-TW">繁體中文</button>
      </div>
    </section>
    <section class="settings-sec">
      <h3 data-i18n="version_title">VERSION & UPDATES</h3>
      <div class="ver-row">
        <span class="ver-text">v{{VERSION}}</span>
        <button id="checkUpdateBtn" type="button" data-i18n="btn_check_update">Check for Updates</button>
      </div>
      <div id="updateResult" class="update-result" hidden></div>
    </section>
    <div class="actions">
      <button id="settingsCloseAction" type="button" class="primary" data-i18n="close">Close</button>
    </div>
  </div>
</div>

window.__I18N = (function () {

  const DICT = {

      btn_cancel: 'Cancel',
      btn_update: 'Update',
      dlg_updating_title: 'Updating',
      dlg_updating_body: 'Downloading and installing new version. Please wait and do not close this window.',
      dlg_done_title: 'Update Complete',
      dlg_done_body: 'Updated to v{version}. Please restart this window to use the new version.',
      dlg_already_updated: 'Already updated. Please restart this window to use the new version.',
      dlg_fail_title: 'Update Failed',
      dlg_fail_body: '{error} You can try again later or re-run the install script.',
      dlg_dev_title: 'Cannot Update',
      dlg_dev_body: 'Running in development mode from source directory. Updates are disabled. Please install via install script.',
      dlg_check_title: 'Checking for Updates',
      dlg_check_body: 'Connecting to GitHub to check for the latest version…',
      dlg_check_fail: 'Check Failed',
      dlg_uptodate_title: 'Up to Date',
      dlg_uptodate_body: 'v{current} is currently the latest version.',
      dlg_new_title: 'Update Available',

      err_nomesh: 'No meshes found in this file.',

      err_meshopt: 'This model uses Meshopt compression, which is currently not supported.',
      err_draco: 'This model uses Draco compression, requiring an online decoder download which failed.',
      err_generic: 'Failed to load model. The file may be corrupted, uses an unsupported format, or requires an online Draco decoder.',
      preset_studio: 'Studio',
      preset_noon: 'Noon',

      note_lit: 'Preserves original materials with studio environment and directional light.',
      note_flat: 'Unlit color only, shows base textures directly.',

    },
    'zh-TW': {
      hint: '左鍵旋轉 · 滾輪縮放 · 右鍵平移',

      loading: '載入中…',

      btn_cancel: '取消',
      btn_update: '更新',
      dlg_updating_title: '更新中',
      dlg_updating_body: '正在下載並安裝新版本，請稍候，不要關閉視窗。',
      dlg_done_title: '更新完成',
      dlg_done_body: '已更新到 v{version}。請關閉這個視窗後重新開啟，才會使用新版本。',
      dlg_already_updated: '已經更新過了。請關閉這個視窗後重新開啟，才會使用新版本。',
      dlg_fail_title: '更新失敗',
      dlg_fail_body: '{error} 可以稍後再試，或重新執行安裝指令。',
      dlg_dev_title: '無法更新',
      dlg_dev_body: '目前是從原始碼資料夾執行的開發模式，不支援更新。請用安裝腳本安裝後再使用。',
      dlg_check_title: '檢查更新',
      dlg_check_body: '正在連到 GitHub 檢查最新版本…',
      dlg_check_fail: '檢查失敗',
      dlg_uptodate_title: '已是最新版本',
      dlg_uptodate_body: '目前的 v{current} 已經是最新版本。',
      dlg_new_title: '有新版本',
      dlg_new_body: '最新版本為 v{latest}（目前：v{current}）。',
      err_unknown: '發生未知的錯誤。',
      err_no_response: '無法取得回應。',
      err_component: '無法載入檢視元件，請重新安裝 glb-viewer。',
      err_webgl: '這個瀏覽器無法使用 WebGL，沒辦法顯示 3D 模型。',
      err_nomesh: '這個檔案裡沒有網格。',
      err_ktx2: '這個模型使用 KTX2 貼圖壓縮，目前不支援。',
      err_meshopt: '這個模型使用 Meshopt 壓縮，目前不支援。',
      err_draco: '這個模型使用 Draco 壓縮，需要連網下載解碼器，但目前下載失敗。',
      err_generic: '無法載入模型。檔案可能已損毀、使用了不支援的格式，或是 Draco 壓縮的模型但無法連網下載解碼器。',
      preset_studio: '柔和攝影棚',
      preset_noon: '正午強光',
      preset_rim: '側逆光輪廓',
      preset_toon: '卡通',
      note_lit: '保留模型原本的材質，用內建的攝影棚環境光加一盞方向光。',
      note_flat: '沒有光影，只顯示貼圖原本的顏色，檢查上色用。',
      note_toon: '卡通：三階明暗（亮部、中間調、暗部）加描邊，細節和 Blender 渲染會有差異。'
    }
  };

  let currentLang = 'en';
  try {
    const saved = localStorage.getItem('glb-viewer-lang');
    if (saved && DICT[saved]) {
      currentLang = saved;
    } else {
      const nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
      if (nav.startsWith('zh')) currentLang = 'zh-TW';
    }
  } catch (e) {}

  const listeners = [];

  function t(key, vars) {
    let str = (DICT[currentLang] && DICT[currentLang][key]) || (DICT.en && DICT.en[key]) || key;
    if (vars) {
      Object.keys(vars).forEach((k) => {
        str = str.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
      });
    }
    return str;
  }

  function applyDom() {
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const key = el.dataset.i18n;
      if (key) el.textContent = t(key);
    });
    document.querySelectorAll('#langSeg button').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.lang === currentLang);
    });
  }

  function setLanguage(lang) {
    if (!DICT[lang]) return;
    currentLang = lang;
    try { localStorage.setItem('glb-viewer-lang', lang); } catch (e) {}
    document.documentElement.lang = (lang === 'zh-TW' ? 'zh-Hant' : 'en');
    applyDom();
    listeners.forEach((fn) => { try { fn(lang); } catch (err) {} });
  }

  function onLanguageChange(fn) {
    listeners.push(fn);
  }

  return {
    get current() { return currentLang; },
    DICT,
    t,
    setLanguage,
    applyDom,
    onLanguageChange
  };
})();
</script>

<!-- 設定與更新元件 -->
<script>
(function () {
  'use strict';
  const CAN_UPDATE = {{CANUPDATE}};
  const $ = (id) => document.getElementById(id);
  const t = window.__I18N.t;
  let updated = false;
  let busy = false;
  let lastFocusedElement = null;
  let updateState = null;

  const settingsBtn = $('settingsBtn');
  const settingsDlg = $('settingsDlg');
  const closeSettingsBtn = $('closeSettingsBtn');
  const settingsCloseAction = $('settingsCloseAction');
  const checkUpdateBtn = $('checkUpdateBtn');
  const updateResult = $('updateResult');
  const langSeg = $('langSeg');

  function renderUpdateResult() {
    if (!updateState) {
      updateResult.hidden = true;
      updateResult.textContent = '';
      return;
    }
    updateResult.hidden = false;
    updateResult.textContent = '';
    if (updateState.status === 'already') {
      updateResult.className = 'update-result';
      updateResult.textContent = t('dlg_already_updated');
    } else if (updateState.status === 'dev') {
      updateResult.className = 'update-result err';
      updateResult.textContent = t('dlg_dev_body');
    } else if (updateState.status === 'checking') {
      updateResult.className = 'update-result';
      updateResult.textContent = t('dlg_check_body');
    } else if (updateState.status === 'err') {
      updateResult.className = 'update-result err';
      updateResult.textContent = updateState.data.error || t('err_unknown');
    } else if (updateState.status === 'uptodate') {
      updateResult.className = 'update-result';
      updateResult.textContent = t('dlg_uptodate_body', { current: updateState.data.current });
    } else if (updateState.status === 'newer') {
      updateResult.className = 'update-result';
      const p = document.createElement('div');
      p.className = 'highlight';
      p.textContent = t('dlg_new_body', { current: updateState.data.current, latest: updateState.data.latest });
      const act = document.createElement('div');
      act.className = 'update-action';
      const upBtn = document.createElement('button');
      upBtn.type = 'button';
      upBtn.textContent = t('btn_update_now', { version: updateState.data.latest });
      upBtn.addEventListener('click', () => {
        closeSettings();
        apply();
      });
      act.appendChild(upBtn);
      updateResult.appendChild(p);
      updateResult.appendChild(act);
    }
  }

  function openSettings() {
    if (!$('dlg').hidden) return;
    updateState = null;
    renderUpdateResult();
    settingsDlg.hidden = false;
    window.__I18N.applyDom();
    (settingsDlg.querySelector('.seg button.active') || settingsDlg.querySelector('button') || settingsDlg.firstElementChild).focus();
  }

  function closeSettings() {
    settingsDlg.hidden = true;
    settingsBtn.focus();
  }

  settingsBtn.addEventListener('click', openSettings);
  closeSettingsBtn.addEventListener('click', closeSettings);
  settingsCloseAction.addEventListener('click', closeSettings);

  if (langSeg) {
    langSeg.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b && b.dataset.lang) {
        window.__I18N.setLanguage(b.dataset.lang);
      }
    });
  }

  window.__I18N.applyDom();
  window.__I18N.onLanguageChange(() => {
    renderUpdateResult();
  });

  function closeDialog() {
    $('dlg').hidden = true;
    if (lastFocusedElement && typeof lastFocusedElement.focus === 'function') {
      lastFocusedElement.focus();
    } else {
      settingsBtn.focus();
    }
  }

  function showDialog(title, body, buttons) {
    lastFocusedElement = document.activeElement;
    busy = buttons.length === 0;
    $('dlgTitle').textContent = title;
    $('dlgBody').textContent = body;
    const box = $('dlgActions');
    box.textContent = '';
    buttons.forEach((b) => {
      const el = document.createElement('button');
      el.type = 'button';
      el.textContent = b.text;
      if (b.primary) el.className = 'primary';
      el.addEventListener('click', () => { closeDialog(); if (b.run) b.run(); });
      box.append(el);
    });
    $('dlg').hidden = false;
    (box.querySelector('.primary') || box.querySelector('button') || $('dlg').firstElementChild).focus();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      if (!$('dlg').hidden) {
        if (!busy) closeDialog();
        return;
      }
      if (!settingsDlg.hidden) {
        closeSettings();
        return;
      }
    }
    if (e.key === 'Tab') {
      const activeDlg = !$('dlg').hidden ? $('dlg') : (!settingsDlg.hidden ? settingsDlg : null);
      if (activeDlg) {
        e.preventDefault();
        const items = [...activeDlg.querySelectorAll('button:not([disabled]), input:not([disabled])')];
        if (!items.length) { activeDlg.firstElementChild.focus(); return; }
        const at = items.indexOf(document.activeElement);
        items[(at + (e.shiftKey ? items.length - 1 : 1)) % items.length].focus();
      }
    }
  });

  async function callApi(path, method) {
    try {
      const res = await fetch(path, { method: method || 'GET', cache: 'no-store' });
      return await res.json();
    } catch (e) {
      return { ok: false, error: t('err_no_response') };
    }
  }

  const getCloseBtn = () => [{ text: t('close') }];

  async function apply() {
    showDialog(t('dlg_updating_title'), t('dlg_updating_body'), []);
    const r = await callApi('update/apply', 'POST');
    if (r.ok) {
      updated = true;
      showDialog(t('dlg_done_title'), t('dlg_done_body', { version: r.version }), getCloseBtn());
    } else {
      showDialog(t('dlg_fail_title'), t('dlg_fail_body', { error: r.error || t('err_unknown') }), getCloseBtn());
    }
  }

  checkUpdateBtn.addEventListener('click', async () => {
    if (updated) {
      updateState = { status: 'already' };
      renderUpdateResult();
      return;
    }
    if (!CAN_UPDATE) {
      updateState = { status: 'dev' };
      renderUpdateResult();
      return;
    }
    updateState = { status: 'checking' };
    renderUpdateResult();
    checkUpdateBtn.disabled = true;

    const r = await callApi('update/check');
    checkUpdateBtn.disabled = false;
    if (!r.ok) {
      updateState = { status: 'err', data: { error: r.error } };
    } else if (!r.newer) {
      updateState = { status: 'uptodate', data: { current: r.current } };
    } else {
      updateState = { status: 'newer', data: { current: r.current, latest: r.latest } };
    }
    renderUpdateResult();
  });
})();
</script>

<script src="three.min.js"></script>
<script src="OrbitControls.js"></script>
<script src="GLTFLoader.js"></script>
<script src="DRACOLoader.js"></script>
<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const msg = $('msg');
  const stage = $('stage');
  const t = window.__I18N.t;
  let currentErrorKey = null;

  function showError(key, directText) {
    msg.hidden = false;
    msg.className = 'err';
    currentErrorKey = key || null;
    msg.textContent = key ? t(key) : directText;
  }

  window.__I18N.onLanguageChange(() => {
    if (currentErrorKey) {
      msg.textContent = t(currentErrorKey);
    }
  });

  if (!window.THREE || !THREE.GLTFLoader || !THREE.OrbitControls || !THREE.DRACOLoader) {
    showError('err_component');
    return;
  }

  /* ---------- Lighting Presets ---------- */
  const PRESET_DEFS = [
    { id: 'studio', mode: 'lit',  attach: true,  az: -35,  el: 35, dirI: 1.0, amb: 1.0 },
    { id: 'noon',   mode: 'lit',  attach: false, az: 30,   el: 70, dirI: 2.6, amb: 0.3 },
    { id: 'rim',    mode: 'lit',  attach: true,  az: 135,  el: 20, dirI: 2.4, amb: 0.45 },
    { id: 'toon',   mode: 'toon', attach: true,  az: -32.7, el: 33.5, thr: 0.15, hi: 0.60, outline: 2.0 },
  ];
  const MODE_KEYS = {
    lit: ['attach', 'az', 'el', 'dirI', 'amb'],
    flat: [],
    toon: ['attach', 'az', 'el', 'thr', 'hi', 'outline'],
  };
  const state = Object.assign({ thr: 0.15, hi: 0.60, outline: 2.0, dirI: 1.0, amb: 1.0 }, PRESET_DEFS[0]);
  delete state.id;

  const SHADOW_TINT = [0.86, 0.72, 0.70];
  const MID_TINT = [0.93, 0.86, 0.85];
  const OUTLINE_SRGB = [0.634, 0.462, 0.272];

  /* ---------- Renderer & Scene ---------- */
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: false });
  } catch (e) {
    showError('err_webgl');
    return;
  }
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1;
  renderer.setClearColor(0x000000, 0);
  stage.appendChild(renderer.domElement);
  const canvas = renderer.domElement;

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 200);
  const sun = new THREE.DirectionalLight(0xffffff, state.dirI);
  scene.add(sun, sun.target);

  function buildEnvironment() {
    const env = new THREE.Scene();
    const room = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshBasicMaterial({ side: THREE.BackSide, color: new THREE.Color(0.32, 0.33, 0.35) }));
    room.scale.setScalar(24);
    env.add(room);
    const panel = (w, h, x, y, z, power) => {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, color: new THREE.Color().setScalar(power) }));
      m.position.set(x, y, z);
      m.lookAt(0, 0, 0);
      env.add(m);
    };
    panel(12, 12, 0, 11, 0, 7);
    panel(7, 9, -10, 3, 5, 4);
    panel(6, 8, 10, 2, -2, 2.2);
    panel(12, 3, 0, 4, -11, 3);
    const pmrem = new THREE.PMREMGenerator(renderer);
    const tex = pmrem.fromScene(env, 0.04).texture;
    pmrem.dispose();
    env.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
    return tex;
  }
  scene.environment = buildEnvironment();

  /* ---------- Toon Materials ---------- */
  const toonVS = `
    #include <common>
    #include <skinning_pars_vertex>
    #include <morphtarget_pars_vertex>
    varying vec3 vN; varying vec2 vUv; varying vec3 vC;
    void main() {
      #include <beginnormal_vertex>
      #include <morphnormal_vertex>
      #include <skinbase_vertex>
      #include <skinnormal_vertex>
      #include <defaultnormal_vertex>
      vN = normalize(transformedNormal);
      vUv = uv;
      #ifdef USE_COLOR
        vC = color.rgb;
      #else
        vC = vec3(1.0);
      #endif
      #include <begin_vertex>
      #include <morphtarget_vertex>
      #include <skinning_vertex>
      gl_Position = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
    }`;
  const toonFS = `
    uniform sampler2D map; uniform bool hasMap; uniform vec3 baseColor; uniform float opacity; uniform float alphaCut;
    uniform vec3 lightDir; uniform float thr; uniform float hi; uniform vec3 tint; uniform vec3 midTint;
    varying vec3 vN; varying vec2 vUv; varying vec3 vC;
    void main() {
      vec3 lin = baseColor * vC;
      float a = opacity;
      if (hasMap) {
        vec4 tex = texture2D(map, vUv);
        lin *= pow(tex.rgb, vec3(2.2));
        a *= tex.a;
      }
      if (a < alphaCut) discard;
      vec3 n = normalize(vN);
      #ifdef DOUBLE_SIDED
        if (!gl_FrontFacing) n = -n;
      #endif
      float ndl = dot(n, lightDir);
      float mid = smoothstep(thr - 0.015, thr + 0.015, ndl);
      float lit = smoothstep(hi - 0.015, hi + 0.015, ndl);
      vec3 shaded = lin * mix(mix(tint, midTint, mid), vec3(1.0), lit);
      gl_FragColor = vec4(pow(shaded, vec3(1.0 / 2.2)), 1.0);
    }`;
  const outlineVS = `
    #include <common>
    #include <skinning_pars_vertex>
    #include <morphtarget_pars_vertex>
    uniform float thick; uniform vec2 res;
    void main() {
      #include <beginnormal_vertex>
      #include <morphnormal_vertex>
      #include <skinbase_vertex>
      #include <skinnormal_vertex>
      #include <begin_vertex>
      #include <morphtarget_vertex>
      #include <skinning_vertex>
      vec4 p = projectionMatrix * modelViewMatrix * vec4(transformed, 1.0);
      vec4 cn = projectionMatrix * vec4(normalMatrix * objectNormal, 0.0);
      vec2 d = cn.xy; float l = length(d);
      if (l > 1e-5) d /= l;
      p.xy += d * thick * 2.0 / res * p.w;
      gl_Position = p;
    }`;
  const outlineFS = `uniform vec3 col; void main() { gl_FragColor = vec4(col, 1.0); }`;

  const toonUniforms = [];
  const outlineUniforms = [];

  function makeVariants(mesh) {
    const src = mesh.material;
    const map = src.map || null;
    if (map) map.anisotropy = renderer.capabilities.getMaxAnisotropy();
    const geo = mesh.geometry;
    const vc = !!src.vertexColors && !!geo.attributes.color;
    const color = src.color ? src.color.clone() : new THREE.Color(1, 1, 1);
    const morph = { skinning: !!mesh.isSkinnedMesh, morphTargets: !!(geo.morphAttributes && geo.morphAttributes.position),
      morphNormals: !!(geo.morphAttributes && geo.morphAttributes.normal) };
    const opacity = src.opacity === undefined ? 1 : src.opacity;
    const alphaCut = src.alphaTest > 0 ? src.alphaTest : (src.transparent ? 0.5 : 0.0);

    const toonMat = new THREE.ShaderMaterial(Object.assign({
      vertexShader: toonVS, fragmentShader: toonFS, vertexColors: vc, side: src.side,
      uniforms: {
        map: { value: map }, hasMap: { value: !!map }, baseColor: { value: new THREE.Vector3(color.r, color.g, color.b) },
        opacity: { value: opacity }, alphaCut: { value: alphaCut },
        lightDir: { value: new THREE.Vector3(0, 0, 1) }, thr: { value: state.thr }, hi: { value: state.hi },
        tint: { value: new THREE.Vector3(...SHADOW_TINT) }, midTint: { value: new THREE.Vector3(...MID_TINT) },
      },
    }, morph));
    const outlineMat = new THREE.ShaderMaterial(Object.assign({
      vertexShader: outlineVS, fragmentShader: outlineFS, side: THREE.BackSide,
      uniforms: { thick: { value: 2 }, res: { value: new THREE.Vector2(1, 1) }, col: { value: new THREE.Vector3(...OUTLINE_SRGB) } },
    }, morph));
    toonUniforms.push(toonMat.uniforms);
    outlineUniforms.push(outlineMat.uniforms);

    const flatMat = new THREE.MeshBasicMaterial({
      map, color, vertexColors: !!src.vertexColors, side: src.side, opacity, transparent: src.transparent,
      alphaTest: src.alphaTest, toneMapped: false,
    });
    return { lit: src, flat: flatMat, toon: toonMat, outlineMat };
  }

  /* ---------- Model ---------- */
  let root = null;
  let meshes = [];
  let mixer = null;
  let actions = [];
  let playing = false;
  let radius = 1;

  function setModel(gltf) {
    const model = gltf.scene;
    model.traverse((o) => { if (o.isMesh) meshes.push(o); });
    if (!meshes.length) { meshes = []; showError('err_nomesh'); return; }
    root = new THREE.Group();
    root.add(model);
    scene.add(root);
    root.updateMatrixWorld(true);

    const box = new THREE.Box3().setFromObject(root);
    const size = box.getSize(new THREE.Vector3());
    model.position.sub(box.getCenter(new THREE.Vector3()));
    root.updateMatrixWorld(true);
    radius = Math.max(size.length() / 2, 1e-6);

    meshes.forEach((m) => {
      if (!m.geometry.attributes.normal) m.geometry.computeVertexNormals();
      const v = makeVariants(m);
      m.userData.variants = v;
      let outline;
      if (m.isSkinnedMesh) {
        outline = new THREE.SkinnedMesh(m.geometry, v.outlineMat);
        outline.bind(m.skeleton, m.bindMatrix);
        m.frustumCulled = false;
      } else {
        outline = new THREE.Mesh(m.geometry, v.outlineMat);
      }
      outline.frustumCulled = false;
      if (m.morphTargetInfluences) {
        outline.morphTargetInfluences = m.morphTargetInfluences;
        outline.morphTargetDictionary = m.morphTargetDictionary;
      }
      m.add(outline);
      m.userData.outline = outline;
    });

    if (gltf.animations && gltf.animations.length) {
      mixer = new THREE.AnimationMixer(model);
      actions = gltf.animations.map((clip) => { const a = mixer.clipAction(clip); a.play(); a.paused = true; return a; });
      $('anim').hidden = false;
    }

    currentErrorKey = null;
    msg.hidden = true;
    applyMode();
    resetView();
  }

  function setPlaying(on) {
    playing = on;
    actions.forEach((a) => { a.paused = !on; });
    $('anim').setAttribute('aria-pressed', String(on));
    need();
  }

  function applyMode() {
    meshes.forEach((m) => {
      m.material = m.userData.variants[state.mode];
      const src = m.userData.variants.lit;
      const cutout = src.transparent || src.alphaTest > 0;
      m.userData.outline.visible = state.mode === 'toon' && state.outline > 0 && !cutout;
    });
    need();
    syncControls();
  }

  /* ---------- Camera View ---------- */
  function resetView() {
    const dir = new THREE.Vector3(0, 0.18, 1).normalize();
    const fov = THREE.MathUtils.degToRad(camera.fov);
    const fitV = radius / Math.sin(fov / 2);
    const fitH = radius / Math.sin(Math.atan(Math.tan(fov / 2) * camera.aspect));
    const dist = Math.max(fitV, fitH) * 1.05;
    controls.target.set(0, 0, 0);
    camera.position.copy(dir.multiplyScalar(dist));
    camera.near = dist / 100; camera.far = dist * 20; camera.updateProjectionMatrix();
    controls.minDistance = radius * 0.3; controls.maxDistance = dist * 6;
    controls.update();
    need();
  }

  /* ---------- Lighting ---------- */
  function angleToDir(az, el, out = new THREE.Vector3()) {
    const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
    return out.set(Math.cos(e) * Math.sin(a), Math.sin(e), Math.cos(e) * Math.cos(a));
  }
  function dirToAngle(d) {
    return { el: THREE.MathUtils.radToDeg(Math.asin(Math.max(-1, Math.min(1, d.y)))), az: THREE.MathUtils.radToDeg(Math.atan2(d.x, d.z)) };
  }

  let dirty = true;
  function need() { dirty = true; }

  const clock = new THREE.Clock();
  function loop() {
    const dt = clock.getDelta();
    if (controls.autoRotate) controls.update();
    if (mixer && playing) { mixer.update(dt); need(); }
    if (dirty) { dirty = false; render(); }
    requestAnimationFrame(loop);
  }

  const worldDir = new THREE.Vector3();
  const viewDir = new THREE.Vector3();
  const canvasSize = new THREE.Vector2();
  function render() {
    camera.updateMatrixWorld();
    angleToDir(state.az, state.el, worldDir);
    if (state.attach) { viewDir.copy(worldDir); worldDir.applyQuaternion(camera.quaternion); }
    else { viewDir.copy(worldDir).transformDirection(camera.matrixWorldInverse); }
    if (state.mode === 'lit') {
      sun.position.copy(worldDir).multiplyScalar(10);
      sun.intensity = state.dirI;
      meshes.forEach((m) => {
        const lit = m.userData.variants.lit;
        if ('envMapIntensity' in lit) lit.envMapIntensity = state.amb;
      });
    } else if (state.mode === 'toon') {
      const pr = renderer.getPixelRatio();
      renderer.getSize(canvasSize);
      toonUniforms.forEach((u) => { u.lightDir.value.copy(viewDir); u.thr.value = state.thr; u.hi.value = state.hi; });
      outlineUniforms.forEach((u) => { u.thick.value = state.outline * pr; u.res.value.set(canvasSize.x * pr, canvasSize.y * pr); });
    }
    renderer.render(scene, camera);
  }

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h);
    camera.aspect = w / h; camera.updateProjectionMatrix();
    need();
  }
  new ResizeObserver(resize).observe(stage);

  /* ---------- Interaction ---------- */
  let lightDrag = null;
  canvas.addEventListener('pointerdown', (e) => {
    if (!e.shiftKey || e.button !== 0) return;
    e.stopImmediatePropagation();
    lightDrag = { x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!lightDrag) return;
    state.az = ((state.az + (e.clientX - lightDrag.x) * 0.6 + 540) % 360) - 180;
    state.el = Math.max(-89, Math.min(89, state.el - (e.clientY - lightDrag.y) * 0.6));
    lightDrag = { x: e.clientX, y: e.clientY };
    syncControls();
    need();
  });
  const endDrag = (e) => { if (lightDrag) { lightDrag = null; try { canvas.releasePointerCapture(e.pointerId); } catch (_) {} } };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);

  const controls = new THREE.OrbitControls(camera, canvas);
  controls.screenSpacePanning = true;
  controls.autoRotate = false;
  controls.autoRotateSpeed = 5;
  controls.addEventListener('change', () => need());

  /* ---------- Controls & Presets ---------- */
  function presetMatches(p) {
    if (p.mode !== state.mode) return false;
    return MODE_KEYS[p.mode].every((k) => (typeof p[k] === 'number' ? Math.abs(p[k] - state[k]) < (k === 'az' || k === 'el' ? 0.5 : 0.005) : p[k] === state[k]));
  }

  function syncControls() {
    $('attach').checked = state.attach;
    [['az', state.az, '°'], ['el', state.el, '°'], ['dirI', state.dirI, ''], ['amb', state.amb, ''], ['thr', state.thr, ''], ['hi', state.hi, ''], ['outline', state.outline, '']].forEach(([id, v, unit]) => {
      $(id).value = v;
      $(id + 'v').textContent = (Number.isInteger(+v) ? Math.round(v) : (+v).toFixed(2)) + unit;
    });
    const used = MODE_KEYS[state.mode];
    [['rowAz', 'az'], ['rowEl', 'el'], ['rowI', 'dirI'], ['rowA', 'amb'], ['rowT', 'thr'], ['rowH', 'hi'], ['rowO', 'outline']].forEach(([row, key]) => {
      const on = used.includes(key);
      $(row).classList.toggle('dim', !on);
      $(row).querySelector('input').disabled = !on;
    });
    $('attach').disabled = !used.includes('attach');
    document.querySelectorAll('#modes button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode)));
    document.querySelectorAll('#presets button').forEach((b) => {
      b.setAttribute('aria-pressed', String(presetMatches(PRESET_DEFS.find((p) => p.id === b.dataset.preset))));
    });
    $('modenote').textContent = t('note_' + state.mode);
  }

  PRESET_DEFS.forEach((p) => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.preset = p.id; b.textContent = t('preset_' + p.id); b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      const { id, ...values } = p;
      Object.assign(state, values);
      applyMode();
    });
    $('presets').append(b);
  });

  window.__I18N.onLanguageChange(() => {
    document.querySelectorAll('#presets button').forEach((b) => {
      b.textContent = t('preset_' + b.dataset.preset);
    });
    $('modenote').textContent = t('note_' + state.mode);
  });

  ['az', 'el', 'dirI', 'amb', 'thr', 'hi', 'outline'].forEach((id) => {
    $(id).addEventListener('input', () => {
      state[id] = parseFloat($(id).value);
      if (id === 'outline') applyMode(); else { syncControls(); need(); }
    });
  });
  $('attach').addEventListener('change', () => {
    camera.updateMatrixWorld();
    const dir = angleToDir(state.az, state.el);
    const out = $('attach').checked ? dir.transformDirection(camera.matrixWorldInverse) : dir.applyQuaternion(camera.quaternion);
    state.attach = $('attach').checked;
    Object.assign(state, dirToAngle(out));
    syncControls(); need();
  });
  $('modes').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) { state.mode = b.dataset.mode; applyMode(); } });

  $('lightBtn').addEventListener('click', () => {
    const open = $('panel').hidden;
    $('panel').hidden = !open;
    $('lightBtn').setAttribute('aria-pressed', String(open));
  });
  $('rotate').addEventListener('click', () => {
    const on = $('rotate').getAttribute('aria-pressed') !== 'true';
    $('rotate').setAttribute('aria-pressed', String(on));
    controls.autoRotate = on;
  });
  $('anim').addEventListener('click', () => setPlaying($('anim').getAttribute('aria-pressed') !== 'true'));

  /* ---------- Load Model ---------- */
  function explainError(err) {
    const text = String((err && err.message) || err || '');
    if (/KTX2/i.test(text)) return 'err_ktx2';
    if (/meshopt/i.test(text)) return 'err_meshopt';
    if (/draco/i.test(text)) return 'err_draco';
    return 'err_generic';
  }

  const draco = new THREE.DRACOLoader();
  draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.4.1/');
  const loader = new THREE.GLTFLoader();
  loader.setDRACOLoader(draco);
  loader.load('model.glb', setModel, undefined, (err) => showError(explainError(err)));

  syncControls();
  resize();
  loop();
  window.__viewer = { state, get meshes() { return meshes; }, need, setPlaying, camera, scene };

  window.addEventListener('pagehide', () => navigator.sendBeacon('bye'));
  setInterval(() => fetch('ping').catch(() => {}), 5000);
})();
</script>
</body>
</html>
